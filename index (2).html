<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ Driving Theory Test – Hindi Practice & Mock Test</title>
<meta name="description" content="New Zealand car learner licence theory test practice in Hindi. Topic-wise practice and a 35-question mock test with score and explanations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f5;--card:#fff;--ink:#17201c;--mute:#5d6b64;--line:#dbe3de;
  --brand:#0f5c45;--brand-ink:#fff;--brand-soft:#e5f3ec;
  --ok:#1a8a56;--ok-bg:#e3f5ea;--bad:#c2372f;--bad-bg:#fdeaea;--warn:#b7791f;--warn-bg:#fff6e0;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1512;--card:#18211c;--ink:#e8efeb;--mute:#9aaba2;--line:#2b3832;
  --brand:#3fb988;--brand-ink:#08150f;--brand-soft:#173126;
  --ok:#4cc88a;--ok-bg:#12301f;--bad:#ff7b72;--bad-bg:#371a19;--warn:#e6b450;--warn-bg:#352b12;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans','Noto Sans Devanagari',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--brand)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 56px}
header.top{background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
header.top a{color:inherit;text-decoration:none;font-weight:700;font-size:17px}
header.top small{opacity:.85}
h1{font-size:28px;line-height:1.25;margin:28px 0 6px}
h2{font-size:20px;margin:28px 0 10px}
p.lead{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:1fr 1fr}
@media(max-width:620px){.grid.two{grid-template-columns:1fr}h1{font-size:23px}}
.hero-card{background:var(--brand);color:var(--brand-ink);border:0}
.hero-card p{opacity:.92;margin:4px 0 14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600}
.hero-card .chip{background:rgba(255,255,255,.18);color:inherit}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
button:hover,.btn:hover{border-color:var(--brand)}
button:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hero-card .primary{background:#fff;color:#0f5c45;border-color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.topics{display:grid;gap:8px}
.topic{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 14px}
.topic span:last-child{color:var(--mute);font-size:13px;white-space:nowrap}
.note{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:22px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px;font-size:14px;color:var(--mute);gap:8px;flex-wrap:wrap}
.qtext{font-size:19px;font-weight:600;margin:16px 0 14px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:12px;font-weight:400;background:var(--card)}
.opt b{flex:none;width:28px;height:28px;border-radius:99px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel b{background:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong b{background:var(--bad);color:#fff}
.opt[disabled]{opacity:1;cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb strong{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.palette button{width:36px;height:36px;padding:0;border-radius:8px;font-size:13px}
.palette .done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.palette .cur{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.score{text-align:center;padding:26px 16px}
.score .big{font-size:56px;font-weight:700;line-height:1.1}
.badge{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:99px;font-weight:700;color:#fff}
.badge.pass{background:var(--ok)}.badge.fail{background:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.rv{margin-bottom:12px}
.rv .tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;margin-left:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.no{background:var(--bad-bg);color:var(--bad)}.tag.sk{background:var(--warn-bg);color:var(--warn)}
.rv .opt{cursor:default;padding:9px 12px;font-size:15px}
.pic{display:block;margin:0 auto 16px;width:100%;max-width:230px;height:auto;border-radius:10px}
.pic.scene{max-width:360px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
footer{color:var(--mute);font-size:13px;text-align:center;margin-top:34px}
</style>
</head>
<body>

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const k in (props||{})){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return e;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function prep(q){ const p = shuffle([0,1,2,3]); return {q:q.q, img:q.i||null, opts:p.map(i=>q.o[i]), correct:p.indexOf(q.a), exp:q.e, topic:q.t}; }
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0'); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function mount(...nodes){ app.replaceChildren(...nodes.flat(Infinity).filter(Boolean)); window.scrollTo(0,0); }
const L = i => 'ABCD'[i];

/* ---------- quiz ---------- */
function startQuiz(mode, list, title, instant){
  stopTimer();
  S = {mode, title, instant: mode==='practice' || !!instant, qs:list.map(prep), ans:list.map(()=>null), i:0, t0:Date.now(), done:false};
  if (mode==='mock'){ timerId = setInterval(()=>{ const e=document.getElementById('timer'); if(e) e.textContent='⏱ '+fmt(Math.floor((Date.now()-S.t0)/1000)); },1000); }
  renderQ();
}
function startMock(instant){
  const pics = shuffle(QUESTIONS.filter(q=>q.i)).slice(0, IMG_IN_MOCK);
  const txt = shuffle(QUESTIONS.filter(q=>!q.i)).slice(0, MOCK_COUNT - pics.length);
  startQuiz('mock', shuffle(pics.concat(txt)), instant ? 'Mock Test' : 'Mock Test (Exam mode)', instant);
}
function startPractice(k){
  if (k==='all') return startQuiz('practice', shuffle(QUESTIONS), 'All topics');
  const i = Number(k);
  if (!TOPICS[i]) return home();
  startQuiz('practice', shuffle(QUESTIONS.filter(q=>q.t===i)), TOPICS[i]);
}

function renderQ(){
  const q = S.qs[S.i], a = S.ans[S.i], n = S.qs.length, practice = S.mode==='practice', inst = S.instant, locked = inst && a!==null;
  const opts = q.opts.map((t,j)=>{
    let cls = 'opt';
    if (locked){ if (j===q.correct) cls += ' right'; else if (j===a) cls += ' wrong'; }
    else if (a===j) cls += ' sel';
    return h('button',{class:cls, disabled:locked, onclick:()=>choose(j)}, h('b',null,L(j)), h('span',null,t));
  });
  const fb = locked ? h('div',{class:'fb'+(a===q.correct?'':' bad')},
      h('strong',null, a===q.correct ? '✅ सही जवाब! (Correct)' : `❌ ग़लत (Wrong). सही जवाब: ${L(q.correct)}. ${q.opts[q.correct]}`),
      h('span',null, q.exp)) : null;
  const last = S.i===n-1;
  const nav = h('div',{class:'nav'},
    h('button',{disabled:S.i===0, onclick:()=>{S.i--;renderQ();}}, '← Previous'),
    h('button',{class:'primary', disabled:inst && a===null, onclick:()=> last ? finish() : (S.i++,renderQ())}, last ? (practice ? 'See result' : 'Finish test') : 'Next →')
  );
  const nodes = [
    h('div',{class:'qhead'}, h('span',null,`${S.title} • Question ${S.i+1} of ${n}`), h('span',null, inst ? `Score: ${S.qs.filter((x,k)=>S.ans[k]===x.correct).length}/${S.ans.filter(x=>x!==null).length}` : '', (inst && !practice) ? ' • ' : '', practice ? '' : h('span',{id:'timer'},'⏱ '+fmt(Math.floor((Date.now()-S.t0)/1000))))),
    h('div',{class:'bar'}, h('i',{style:`width:${(S.i+1)/n*100}%`})),
    h('div',{class:'card',style:'margin-top:16px'}, h('div',{class:'qtext'}, q.q), q.img ? h('div',{html:q.img}) : null, h('div',{class:'opts'}, opts), fb),
    nav
  ];
  if (!practice){
    nodes.push(h('div',{class:'palette','aria-label':'Question navigator'}, S.qs.map((_,k)=>h('button',{class:k===S.i?'cur':(S.ans[k]!==null?'done':''), onclick:()=>{S.i=k;renderQ();}}, k+1))));
    nodes.push(h('p',{style:'margin-top:16px'}, h('button',{onclick:()=>{ if(confirm('Quit this test? Progress will be lost.')){ location.hash='#/'; } }}, 'Quit test')));
  } else {
    nodes.push(h('p',{style:'margin-top:16px'}, h('button',{onclick:()=>{ location.hash='#/'; }}, '← Back to topics'), ' ', h('button',{onclick:finish}, 'End & see result')));
  }
  mount(...nodes);
}
function choose(j){
  if (S.instant && S.ans[S.i]!==null) return;
  S.ans[S.i] = j;
  renderQ();
  const f = app.querySelector('.fb'); if (f && f.scrollIntoView) f.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function finish(){
  const un = S.ans.filter(x=>x===null).length;
  if (S.mode==='mock' && un>0 && !confirm(`${un} question(s) unanswered. Finish anyway?`)) return;
  S.done = true; stopTimer(); S.secs = Math.floor((Date.now()-S.t0)/1000);
  results('all');
}

/* ---------- results ---------- */
function results(filter){
  const n = S.qs.length;
  const score = S.qs.filter((q,k)=>S.ans[k]===q.correct).length;
  const wrong = S.qs.filter((q,k)=>S.ans[k]!==null && S.ans[k]!==q.correct).length;
  const skipped = S.ans.filter(x=>x===null).length;
  const pct = n ? Math.round(score/n*100) : 0;
  const mock = S.mode==='mock', pass = mock && score>=PASS_MARK;
  if (mock && !S.saved){ S.saved = true; const b = store('nz_best_mock'); if(!b || score>b.score) store('nz_best_mock',{score,total:n}); }

  const items = S.qs.map((q,k)=>({q,k,a:S.ans[k]})).filter(({q,a})=> filter==='all' || (filter==='wrong' && a!==null && a!==q.correct) || (filter==='skipped' && a===null));
  const fbtn = (key,label)=>h('button',{class:filter===key?'on':'', onclick:()=>results(key)}, label);

  mount(
    h('div',{class:'card score'},
      h('div',{style:'color:var(--mute)'}, mock ? 'Mock Test Result' : S.title+' – Result'),
      h('div',{class:'big'}, `${score} / ${n}`),
      h('div',null, `${pct}%` + (S.secs!=null ? ` • Time ${fmt(S.secs)}` : '')),
      mock ? h('span',{class:'badge '+(pass?'pass':'fail')}, pass ? `PASS 🎉 (need ${PASS_MARK}/${n})` : `NOT YET (need ${PASS_MARK}/${n})`) : null,
      h('div',{class:'stats',style:'justify-content:center'}, h('span',{class:'chip'}, `✅ Correct ${score}`), h('span',{class:'chip'}, `❌ Wrong ${wrong}`), h('span',{class:'chip'}, `⏭ Skipped ${skipped}`)),
      h('div',{class:'share',style:'justify-content:center'},
        mock ? h('button',{class:'primary',onclick:()=>startMock(S.instant)}, 'Try a new mock test') : h('button',{class:'primary',onclick:()=>{ const k=location.hash.split('/')[2]; startPractice(k||'all'); }}, 'Practice again'),
        h('a',{class:'btn',href:'#/'}, 'Home')
      )
    ),
    h('h2',null,'Review your answers (जवाबों की समीक्षा)'),
    h('div',{class:'filters'}, fbtn('all',`All (${n})`), fbtn('wrong',`Wrong (${wrong})`), fbtn('skipped',`Skipped (${skipped})`)),
    items.length ? items.map(({q,k,a})=>{
      const ok = a===q.correct;
      return h('div',{class:'card rv'},
        h('div',{style:'font-weight:600;margin-bottom:8px'}, `Q${k+1}. ${q.q}`, h('span',{class:'tag '+(a===null?'sk':ok?'ok':'no')}, a===null?'Skipped':ok?'Correct':'Wrong')),
        q.img ? h('div',{html:q.img}) : null,
        h('div',{class:'opts'}, q.opts.map((t,j)=>h('div',{class:'opt '+(j===q.correct?'right':(j===a?'wrong':''))}, h('b',null,L(j)), h('span',null, t + (j===a ? '  ← your answer' : '') + (j===q.correct && j!==a ? '  ← correct' : ''))))),
        h('div',{class:'fb'+(ok?'':' bad')}, h('span',null, q.exp))
      );
    }) : h('p',{class:'lead'}, 'Nothing to show here.')
  );
}

/* ---------- router ---------- */
function route(){
  const p = (location.hash||'#/').replace(/^#\/?/,'').split('/');
  if (p[0]==='mock') return startMock(p[1]!=='exam');
  if (p[0]==='practice') return startPractice(p[1]||'all');
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
